# Prometheus + Grafana shared configuration
PROM_USER="prometheus"
PROM_HOME="/etc/prometheus"
PROM_DATA="/var/lib/prometheus"
PROM_SERVICE="prometheus"
PROM_PORT="9090
GRAFANA_USER="grafana"
GRAFANA_HOME="/etc/grafana"
GRAFANA_DATA="/var/lib/grafana"
GRAFANA_SERVICE="grafana-server"
GRAFANA_PORT="3000"
ALERT_SERVICE="alertmanager"
ALERT_HOME="/etc/alertmanager"
