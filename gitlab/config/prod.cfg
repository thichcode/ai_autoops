# GitLab Production — Multi-node topology
GITLAB_VERSION="16.11.0"
GITLAB_EDITION="ee"
BACKUP_RETAIN_DAYS=30

# App nodes (GitLab Rails + Sidekiq + Workhorse)
GITLAB_APP_NODES=("gitlab-app01.company.com" "gitlab-app02.company.com")

# Database (PostgreSQL primary)
GITLAB_DB_HOST="gitlab-db01.company.com"
GITLAB_DB_PORT="5432"
GITLAB_DB_USER="gitlab"
GITLAB_DB_BACKUP_DIR="/backup/gitlab/db"

# Redis
GITLAB_REDIS_HOST="gitlab-redis01.company.com"
GITLAB_REDIS_PORT="6379"

# NFS (HA pair for shared storage: repos, uploads, builds, artifacts)
GITLAB_NFS_NODES=("gitlab-nfs01.company.com" "gitlab-nfs02.company.com")
GITLAB_NFS_EXPORTS=("/exports/gitlab/repos" "/exports/gitlab/uploads" "/exports/gitlab/builds" "/exports/gitlab/artifacts")

# NFS mount points on app nodes
GITLAB_NFS_MOUNTS=("/var/opt/gitlab/git-data/repositories" "/var/opt/gitlab/uploads" "/var/opt/gitlab/builds" "/var/opt/gitlab/artifacts")

# Load balancer (NGINX Plus)
GITLAB_LB_HOST="gitlab.company.com"
GITLAB_LB_UPSTREAM="gitlab_backend"
NGINX_PLUS_API="https://nginx-plus.company.com/api"
