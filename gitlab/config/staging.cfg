# GitLab Staging Configuration
GITLAB_VERSION="16.11.0"
GITLAB_EDITION="ee"
BACKUP_RETAIN_DAYS=7

# App nodes (single node for staging)
GITLAB_APP_NODES=("gitlab-stg01.company.com")

# Database
GITLAB_DB_HOST="gitlab-stg-db01.company.com"
GITLAB_DB_PORT="5432"
GITLAB_DB_USER="gitlab"
GITLAB_DB_BACKUP_DIR="/backup/gitlab/db"

# Redis
GITLAB_REDIS_HOST="gitlab-stg-redis01.company.com"
GITLAB_REDIS_PORT="6379"

# NFS
GITLAB_NFS_NODES=("gitlab-stg-nfs01.company.com")
GITLAB_NFS_EXPORTS=("/exports/gitlab/repos" "/exports/gitlab/uploads" "/exports/gitlab/builds" "/exports/gitlab/artifacts")
GITLAB_NFS_MOUNTS=("/var/opt/gitlab/git-data/repositories" "/var/opt/gitlab/uploads" "/var/opt/gitlab/builds" "/var/opt/gitlab/artifacts")

# Load balancer
GITLAB_LB_HOST="gitlab-stg.company.com"
GITLAB_LB_UPSTREAM="gitlab_backend"
NGINX_PLUS_API="https://nginx-plus-stg.company.com/api"
